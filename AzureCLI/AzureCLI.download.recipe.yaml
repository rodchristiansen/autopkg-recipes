Description: |
  Downloads the latest Azure CLI macOS tarball for one architecture (arm64 or x86_64) from GitHub releases.
  The tarball is unsigned, so it is checked against the SHA-256 digest published in the release notes.
  The release version lands in az_version, not version: the pkg recipe sets version to az_version plus
  its package revision.
Identifier: com.github.rodchristiansen.download.AzureCLI
MinimumVersion: "2.3"
Input:
  NAME: AzureCLI
  ARCH: arm64
Process:
  - Processor: URLTextSearcher
    Arguments:
      url: https://github.com/Azure/azure-cli/releases/latest
      re_pattern: '(?P<sha256>[0-9a-f]{64})\s+azure-cli-(?P<az_version>[\d.]+)-macos-%ARCH%\.tar\.gz'
  - Processor: URLDownloader
    Arguments:
      url: https://github.com/Azure/azure-cli/releases/download/azure-cli-%az_version%/azure-cli-%az_version%-macos-%ARCH%.tar.gz
      filename: "%NAME%-%az_version%-%ARCH%.tar.gz"
  - Processor: EndOfCheckPhase
  - Processor: Sha256Verifier
    Arguments:
      input_path: "%pathname%"
      expected_sha256: "%sha256%"
